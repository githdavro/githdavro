name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats.svg
        run: |
          curl -L \
            "https://github-readme-stats.vercel.app/api?username=githdavro&show_icons=true&include_all_commits=true&count_private=true&theme=default" \
            -o stats.svg

      - name: Commit and push stats.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.svg

          if git diff --cached --quiet; then
            echo "No changes to stats.svg"
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi
