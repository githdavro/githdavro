name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        run: |
          curl -L \
            "https://github-profile-trophy.vercel.app/?username=githdavro&theme=flat&no-frame=true&no-bg=true&column=4&margin-w=15&margin-h=15" \
            -o trophy.svg

      - name: Commit and push trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to trophy.svg"
          else
            git commit -m "chore: update GitHub trophy"
            git push
          fi
